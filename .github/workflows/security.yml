name: Security

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  gitleaks:
    name: Scan for committed secrets
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
