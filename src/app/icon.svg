<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Greedy Eye mark, squared for an icon slot. Geometry is the canonical
       128x64 mark (docs/logo.svg in the backend repo, mirrored by the
       GreedyEyeLogo component) placed unchanged inside a square box: scaled to
       leave a 4px margin and centred vertically. Redrawing it by hand here
       would give the brand a second author.

       The amber is stated literally rather than read from the ring token: a
       favicon renders outside the document, where no CSS variable exists. -->
  <defs>
    <clipPath id="ge-icon-eye">
      <path d="M0 0H128A64 64 0 0 1 0 0Z"/>
    </clipPath>
  </defs>
  <g transform="translate(4 34) scale(0.9375)">
    <g clip-path="url(#ge-icon-eye)" fill="#E5A83B">
      <path d="M0 0H128A64 64 0 0 1 0 0Z" fill="none" stroke="#E5A83B" stroke-width="17"/>
      <circle cx="64" cy="26" r="19"/>
      <rect x="0" y="0" width="128" height="14"/>
    </g>
  </g>
</svg>
